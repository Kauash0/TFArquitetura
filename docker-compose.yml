services:
  db:
    image: postgres:16
    container_name: abrigo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: abrigo
    ports:
      - "5433:5432"
    volumes:
      - abrigo_dados:/var/lib/postgresql/data

  api:
    build: .
    container_name: abrigo_api
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: abrigo
    depends_on:
      - db
    restart: on-failure

volumes:
  abrigo_dados: